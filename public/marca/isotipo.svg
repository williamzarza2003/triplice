      <path d="M31 -4 C35 14 27 26 31 37 S28 56 33 68" fill="none" stroke="#000" stroke-width="5.2" stroke-linecap="round"/>
      <path d="M68 27 C54 25 45 35 31.5 37" fill="none" stroke="#000" stroke-width="4.4" stroke-linecap="round"/>
    </mask>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#0F3D3E" mask="url(#rios)"/>
  <circle cx="23.5" cy="33" r="3.2" fill="#F2C230"/>
</svg>
